<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Gradients -->
    <radialGradient id="tableGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4A2819" />
      <stop offset="60%" stop-color="#2B160F" />
      <stop offset="100%" stop-color="#190B06" />
    </radialGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D1" />
      <stop offset="70%" stop-color="#F0D9AE" />
      <stop offset="100%" stop-color="#DEBE8C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D076" />
      <stop offset="40%" stop-color="#C99A45" />
      <stop offset="100%" stop-color="#8F6822" />
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#873C30" />
      <stop offset="70%" stop-color="#692E24" />
      <stop offset="100%" stop-color="#441A13" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#140804" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas: Vintage Dark Oak Table -->
  <rect width="900" height="600" rx="24" fill="url(#tableGlow)" />
  <rect width="892" height="592" x="4" y="4" rx="20" fill="none" stroke="#C99A45" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="10 6" />

  <!-- Background Ornaments / Flourishes -->
  <g fill="#C99A45" opacity="0.15">
    <circle cx="120" cy="100" r="60" />
    <circle cx="780" cy="100" r="60" />
    <circle cx="120" cy="500" r="60" />
    <circle cx="780" cy="500" r="60" />
  </g>

  <!-- Group: Mockup Kit Composition -->
  <g filter="url(#shadow)">

    <!-- BACK ITEM: Vintage Binder / Folder (Wine Leather) -->
    <g transform="translate(140, 70) rotate(-4)" filter="url(#cardShadow)">
      <rect width="360" height="460" rx="14" fill="url(#wineGrad)" stroke="#C99A45" stroke-width="3" />
      <!-- Gold corner protectors -->
      <polygon points="0,0 45,0 0,45" fill="url(#goldGrad)" />
      <polygon points="360,0 315,0 360,45" fill="url(#goldGrad)" />
      <polygon points="0,460 45,460 0,415" fill="url(#goldGrad)" />
      <polygon points="360,460 315,460 360,415" fill="url(#goldGrad)" />
      <!-- Book spine & debossed label -->
      <rect x="25" y="20" width="310" height="420" rx="8" fill="none" stroke="#C99A45" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6" />
      <rect x="60" y="80" width="240" height="90" rx="8" fill="#441A13" stroke="#C99A45" stroke-width="2" />
      <text x="180" y="118" fill="#C99A45" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">ROTEIRO OFICIAL</text>
      <text x="180" y="148" fill="#FFF0D1" font-family="Georgia, serif" font-size="20" font-weight="900" text-anchor="middle">CAFÉ LITERÁRIO</text>
      <!-- Flourish divider -->
      <path d="M 120 190 Q 180 180 240 190" stroke="#C99A45" stroke-width="2" fill="none" />
      <circle cx="180" cy="185" r="3" fill="#C99A45" />
    </g>

    <!-- CENTER ITEM: Open Roteiro / Parchment Document -->
    <g transform="translate(240, 100)" filter="url(#cardShadow)">
      <rect width="380" height="440" rx="10" fill="url(#parchmentGrad)" stroke="#C99A45" stroke-width="2" />
      <!-- Inner border -->
      <rect x="16" y="16" width="348" height="408" rx="6" fill="none" stroke="#692E24" stroke-width="1.5" stroke-opacity="0.4" />
      
      <!-- Header -->
      <text x="190" y="55" fill="#692E24" font-family="Georgia, serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="2">GUIA PRÁTICO DO PROFESSOR</text>
      <text x="190" y="88" fill="#21140F" font-family="Georgia, serif" font-size="24" font-weight="900" text-anchor="middle">Estrutura do Sarau</text>
      
      <!-- Decorative flourish -->
      <path d="M 110 102 L 270 102" stroke="#C99A45" stroke-width="2" />
      <polygon points="190,98 194,102 190,106 186,102" fill="#692E24" />

      <!-- Step items simulated -->
      <g transform="translate(36, 130)">
        <circle cx="14" cy="14" r="14" fill="#692E24" />
        <text x="14" y="19" fill="#FFF0D1" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">1</text>
        <text x="40" y="14" fill="#21140F" font-family="Georgia, serif" font-size="14" font-weight="bold">Recepção &amp; Credenciamento</text>
        <text x="40" y="30" fill="#692E24" font-family="sans-serif" font-size="11">Crachás de escritores e cardápios</text>
      </g>

      <g transform="translate(36, 185)">
        <circle cx="14" cy="14" r="14" fill="#692E24" />
        <text x="14" y="19" fill="#FFF0D1" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">2</text>
        <text x="40" y="14" fill="#21140F" font-family="Georgia, serif" font-size="14" font-weight="bold">Abertura e Boas-Vindas</text>
        <text x="40" y="30" fill="#692E24" font-family="sans-serif" font-size="11">Música de ambiente e introdução</text>
      </g>

      <g transform="translate(36, 240)">
        <circle cx="14" cy="14" r="14" fill="#692E24" />
        <text x="14" y="19" fill="#FFF0D1" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">3</text>
        <text x="40" y="14" fill="#21140F" font-family="Georgia, serif" font-size="14" font-weight="bold">Roda de Debrates Literários</text>
        <text x="40" y="30" fill="#692E24" font-family="sans-serif" font-size="11">Perguntas provocativas por mesa</text>
      </g>

      <g transform="translate(36, 295)">
        <circle cx="14" cy="14" r="14" fill="#692E24" />
        <text x="14" y="19" fill="#FFF0D1" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">4</text>
        <text x="40" y="14" fill="#21140F" font-family="Georgia, serif" font-size="14" font-weight="bold">Sarau de Declamação Livre</text>
        <text x="40" y="30" fill="#692E24" font-family="sans-serif" font-size="11">Microfone aberto com poemas prontos</text>
      </g>

      <g transform="translate(36, 350)">
        <circle cx="14" cy="14" r="14" fill="#692E24" />
        <text x="14" y="19" fill="#FFF0D1" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">5</text>
        <text x="40" y="14" fill="#21140F" font-family="Georgia, serif" font-size="14" font-weight="bold">Encerramento &amp; Certificados</text>
        <text x="40" y="30" fill="#692E24" font-family="sans-serif" font-size="11">Entrega solene e foto oficial</text>
      </g>

      <!-- Golden Seal stamp bottom right -->
      <g transform="translate(300, 360)">
        <circle cx="30" cy="30" r="28" fill="url(#goldGrad)" stroke="#8F6822" stroke-width="1.5" />
        <circle cx="30" cy="30" r="23" fill="none" stroke="#21140F" stroke-width="1" stroke-dasharray="3 2" />
        <text x="30" y="28" fill="#21140F" font-family="Georgia, serif" font-size="8" font-weight="bold" text-anchor="middle">100% BNCC</text>
        <text x="30" y="38" fill="#21140F" font-family="Georgia, serif" font-size="7" font-weight="bold" text-anchor="middle">VALIDADO</text>
      </g>
    </g>

    <!-- RIGHT ITEM: Cardápio Literário de Mesa (Folded Menu) -->
    <g transform="translate(560, 140) rotate(8)" filter="url(#cardShadow)">
      <rect width="220" height="340" rx="8" fill="url(#parchmentGrad)" stroke="#692E24" stroke-width="2" />
      <rect x="10" y="10" width="200" height="320" rx="6" fill="none" stroke="#C99A45" stroke-width="1.5" />
      
      <text x="110" y="45" fill="#692E24" font-family="Georgia, serif" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="2">CARDÁPIO DE LEITURA</text>
      <text x="110" y="70" fill="#21140F" font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle">Café com Poesia</text>
      
      <line x1="40" y1="82" x2="180" y2="82" stroke="#C99A45" stroke-width="1" />

      <!-- Menu Items -->
      <text x="25" y="115" fill="#692E24" font-family="Georgia, serif" font-size="11" font-weight="bold">☕ Expresso Machado</text>
      <text x="25" y="130" fill="#4A2819" font-family="sans-serif" font-size="9">Contos e ironia refinada</text>

      <text x="25" y="165" fill="#692E24" font-family="Georgia, serif" font-size="11" font-weight="bold">🍂 Capuccino Drummond</text>
      <text x="25" y="180" fill="#4A2819" font-family="sans-serif" font-size="9">Poemas do meio do caminho</text>

      <text x="25" y="215" fill="#692E24" font-family="Georgia, serif" font-size="11" font-weight="bold">✨ Mocca Clarice</text>
      <text x="25" y="230" fill="#4A2819" font-family="sans-serif" font-size="9">Epifanias e introspecção</text>

      <text x="25" y="265" fill="#692E24" font-family="Georgia, serif" font-size="11" font-weight="bold">📜 Chocolate Fernando Pessoa</text>
      <text x="25" y="280" fill="#4A2819" font-family="sans-serif" font-size="9">Heterônimos e sentimentos</text>
    </g>

    <!-- FOREGROUND ITEM: Vintage Coffee Cup with Saucer -->
    <g transform="translate(100, 360)" filter="url(#cardShadow)">
      <!-- Saucer -->
      <ellipse cx="70" cy="95" rx="65" ry="18" fill="#FFF0D1" stroke="#C99A45" stroke-width="3" />
      <ellipse cx="70" cy="95" rx="45" ry="10" fill="#F0D9AE" />
      <!-- Cup -->
      <path d="M 25 45 C 25 85 45 95 70 95 C 95 95 115 85 115 45 Z" fill="#FFF0D1" stroke="#C99A45" stroke-width="3" />
      <!-- Cup Handle -->
      <path d="M 115 50 C 135 50 135 80 110 80" fill="none" stroke="#C99A45" stroke-width="5" stroke-linecap="round" />
      <!-- Coffee Surface with Foam Heart -->
      <ellipse cx="70" cy="45" rx="45" ry="14" fill="#3D1D11" stroke="#C99A45" stroke-width="1" />
      <ellipse cx="70" cy="45" rx="35" ry="9" fill="#4A2819" />
      <path d="M 70 42 C 67 38 60 38 60 43 C 60 48 70 52 70 52 C 70 52 80 48 80 43 C 80 38 73 38 70 42 Z" fill="#FFF0D1" opacity="0.8" />
      <!-- Steam -->
      <path d="M 60 30 Q 55 15 65 5" fill="none" stroke="#FFF0D1" stroke-width="2" stroke-linecap="round" opacity="0.5" />
      <path d="M 72 28 Q 78 12 70 2" fill="none" stroke="#FFF0D1" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <path d="M 82 32 Q 88 18 80 8" fill="none" stroke="#FFF0D1" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    </g>

    <!-- FOREGROUND ITEM: Feather Quill & Inkpot -->
    <g transform="translate(690, 390)" filter="url(#cardShadow)">
      <!-- Inkpot -->
      <rect x="35" y="60" width="40" height="40" rx="6" fill="#21140F" stroke="#C99A45" stroke-width="2" />
      <ellipse cx="55" cy="60" rx="15" ry="6" fill="#C99A45" />
      <!-- Quill Feather -->
      <path d="M 50 62 C 30 10 10 -40 -30 -70 C -15 -45 -10 -20 5 15 C 20 45 40 58 50 62 Z" fill="url(#wineGrad)" stroke="#C99A45" stroke-width="1.5" />
      <path d="M 50 62 L -30 -70" stroke="#FFF0D1" stroke-width="1.2" opacity="0.7" />
    </g>

    <!-- FOREGROUND CERTIFICADO & BADGES (Tilted at the bottom center) -->
    <g transform="translate(320, 420) rotate(-2)" filter="url(#cardShadow)">
      <rect width="280" height="150" rx="8" fill="url(#parchmentGrad)" stroke="#C99A45" stroke-width="2" />
      <rect x="8" y="8" width="264" height="134" rx="6" fill="none" stroke="#692E24" stroke-width="1" stroke-dasharray="4 2" />
      <text x="140" y="32" fill="#692E24" font-family="Georgia, serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">CERTIFICADO DE MÉRITO</text>
      <text x="140" y="54" fill="#21140F" font-family="Georgia, serif" font-size="16" font-weight="900" text-anchor="middle">Leitor &amp; Orador Destaque</text>
      <text x="140" y="75" fill="#4A2819" font-family="sans-serif" font-size="9" text-anchor="middle">Certificamos a participação exemplar no</text>
      <text x="140" y="90" fill="#692E24" font-family="Georgia, serif" font-size="12" font-weight="bold" text-anchor="middle">I Café Literário Escolar</text>
      <line x1="60" y1="120" x2="220" y2="120" stroke="#692E24" stroke-width="1" />
      <text x="140" y="132" fill="#8C6A54" font-family="sans-serif" font-size="8" text-anchor="middle">Assinatura da Coordenação</text>
    </g>
  </g>
</svg>

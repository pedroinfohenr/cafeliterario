    <!-- UTM Tracker & Persistence Script -->
    <script>
      (function() {
        var utmParams = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'src', 'sck'];
        
        function getQueryParam(name) {
          var match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
          return match && decodeURIComponent(match[1].replace(/\+/g, ' '));
        }

        // Save UTMs to localStorage and sessionStorage
        try {
          utmParams.forEach(function(param) {
            var value = getQueryParam(param);
            if (value) {
              sessionStorage.setItem(param, value);
              localStorage.setItem(param, value);
            }
          });
        } catch(e) {}

        // Helper to append UTM parameters to any URL
        window.appendCurrentUtms = function(url) {
          if (!url || typeof url !== 'string') return url;
          try {
            var isRelative = !url.startsWith('http://') && !url.startsWith('https://');
            var u = new URL(url, window.location.origin);
            utmParams.forEach(function(param) {
              var val = getQueryParam(param) || sessionStorage.getItem(param) || localStorage.getItem(param);
              if (val && !u.searchParams.has(param)) {
                u.searchParams.set(param, val);
              }
            });
            return isRelative ? u.pathname + u.search + u.hash : u.toString();
          } catch(e) {
            return url;
          }
        };

        // Automatically pass UTMs to all checkout links
        function updateAllLinks() {
          var links = document.querySelectorAll('a[href]');
          links.forEach(function(a) {
            var href = a.getAttribute('href');
            if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
              var updated = window.appendCurrentUtms(href);
              if (updated && updated !== href) {
                a.setAttribute('href', updated);
              }
            }
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', updateAllLinks);
        } else {
          updateAllLinks();
        }
        setInterval(updateAllLinks, 2000);
      })();
    </script>
    <!-- End UTM Tracker Script -->
